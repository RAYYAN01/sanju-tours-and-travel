    <!-- Structured data: one LocalBusiness entity for the whole site.
         FAQ + fleet-pricing schema is added at runtime by
         src/components/StructuredData.tsx from the same data the pages use.
         NOTE: aggregateRating must reflect a real, verifiable review score
         (e.g. Google Business Profile). Update or remove ratingValue /
         reviewCount if the figure changes. Add profile URLs to sameAs. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["TravelAgency", "TaxiService"],
      "@id": "https://sanju-tours-and-travel.vercel.app/#business",
      "name": "Sanju Tours & Travels",
      "alternateName": "Sanju Tours and Travels Hubballi",
      "url": "https://sanju-tours-and-travel.vercel.app/",
      "image": "https://sanju-tours-and-travel.vercel.app/assets/hero_travel_fleet.jpg",
      "logo": "https://sanju-tours-and-travel.vercel.app/logo-512.jpg",
      "telephone": "+91-73381-48518",
      "priceRange": "₹₹",
      "slogan": "Every journey deserves the right ride.",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Cash, UPI, Bank Transfer",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "P.B. Road, Opp. Siddhappilla Temple, Unkal",
        "addressLocality": "Hubballi",
        "addressRegion": "Karnataka",
        "postalCode": "580031",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 15.3647,
        "longitude": 75.1240
      },
      "hasMap": "https://www.google.com/maps/search/?api=1&query=Sanju%20Tours%20%26%20Travels%2C%20Unkal%2C%20Hubballi",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-73381-48518",
        "contactType": "reservations",
        "areaServed": "IN",
        "availableLanguage": ["en", "hi", "kn"]
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "210",
        "bestRating": "5"
      },
      "areaServed": [
        { "@type": "City", "name": "Hubballi" },
        { "@type": "City", "name": "Dharwad" },
        { "@type": "AdministrativeArea", "name": "North Karnataka" },
        { "@type": "Place", "name": "Hubballi Airport (HBX)" },
        { "@type": "Place", "name": "Goa" },
        { "@type": "Place", "name": "Dandeli" },
        { "@type": "Place", "name": "Badami" },
        { "@type": "Place", "name": "Hampi" },
        { "@type": "Place", "name": "Gokarna" },
        { "@type": "Place", "name": "Jog Falls" }
      ],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "00:00",
        "closes": "23:59"
      },
      "knowsAbout": [
        "Airport transfers", "Outstation cabs", "Tempo Traveller rental",
        "Luxury coach hire", "Wedding transportation", "Corporate travel",
        "Hubli to Goa taxi", "Badami Hampi tour package"
      ],
      "sameAs": []
    }
    </script>
